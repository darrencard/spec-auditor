[project]
name = "spec-auditor"
version = "0.3.4"
description = "A skill that audits a PRD or spec against its landing brief and a checklist."
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 200
target-version = "py311"
# Unchanged copies from the Leader Report at the commit in VENDORED.json; their tests and lint live in that repository.
extend-exclude = [
  "skills/spec-auditor/scripts/landing_brief.py",
  "skills/spec-auditor/scripts/from_linear.py",
  "skills/spec-auditor/scripts/from_notion.py",
  "skills/spec-auditor/scripts/from_gdrive.py",
  "skills/spec-auditor/scripts/collect.py",
  "skills/spec-auditor/scripts/convert.py",
  # svgkit, copied byte for byte from landing-loop at the commit in VENDORED.json.
  "skills/spec-auditor/scripts/vendor",
]

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: older syntax. SIM: needless complexity. S: security.
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
